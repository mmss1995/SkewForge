# SkewForge behind nginx: TLS and your API stay in nginx, every other path goes to the gateway.
upstream skewforge_edge {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 443 ssl;
  server_name shop.example.com;
  # ssl_certificate ...;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;  # your backend, untouched
  }

  # Version stream: no buffering, long timeouts.
  location /__skewforge/stream {
    proxy_pass http://skewforge_edge;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://skewforge_edge;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    # The gateway follows the Referer to serve a chunk from the deployment that imported it.
    proxy_set_header Referer $http_referer;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
